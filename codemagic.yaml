# Einz iOS 构建配置（Codemagic）
#
# 使用前提（详见 docs/CI.md 第二节）：
#   1. 在 Codemagic 添加 git.tic.cc/fon/einz 仓库（SSH 方式）
#   2. 在 Codemagic Signing → iOS 配置 Apple 签名（bundle id: cc.tic.einz）
#
# 构建产物：app/build/ios/ipa/*.ipa（已签名）
workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      # Podfile 存在时走 CocoaPods，避免 Flutter 3.47 默认 SPM 与本地 libsodium pod 冲突
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Flutter pub get
        working_directory: app
        script: |
          flutter pub get
      - name: Build iOS IPA
        working_directory: app
        script: |
          # 必须显式给导出配置，否则默认导出方式不是 app-store，产物传不了 TestFlight。
          # 两个描述文件都要在 Codemagic 的 Code signing 里装齐：
          #   Einz Dist Adhoc            → archive 阶段用（工程 Release 写死了它）
          #   Einz Dist AppStoreConnect  → 导出阶段重签用
          flutter build ipa --release --export-options-plist=ios/exportOptionsAppStore.plist
    artifacts:
      - app/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - codemagic@tic.cc   # TODO: 改为你的邮箱，构建失败/成功时通知
