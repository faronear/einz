# Einz iOS / macOS / Windows 构建配置（Codemagic）
#
# 使用前提（详见 docs/CI.md 第二节）：
#   1. 在 Codemagic 添加 git.tic.cc/fon/einz 仓库（SSH 方式）
#   2. 在 Codemagic Signing → iOS 配置 Apple 签名（bundle id: cc.tic.einz）
#   3. Windows 构建需要 Codemagic 账户启用 billing（Windows 实例不在免费额度内）
#
# 构建产物：
#   ios-release    → app/build/ios/ipa/*.ipa（已签名）
#   macos-release  → app/build/macos/Build/Products/Release/*.app（未公证）
#   windows-release→ app/build/windows/x64/runner/Release/*.zip
workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      # Podfile 存在时走 CocoaPods，避免 Flutter 3.47 默认 SPM 与本地 libsodium pod 冲突
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Flutter pub get
        working_directory: app
        script: |
          flutter pub get
      - name: Build iOS IPA
        working_directory: app
        script: |
          # 必须显式给导出配置，否则默认导出方式不是 app-store，产物传不了 TestFlight。
          # 两个描述文件都要在 Codemagic 的 Code signing 里装齐：
          #   Einz Dist Adhoc            → archive 阶段用（工程 Release 写死了它）
          #   Einz Dist AppStoreConnect  → 导出阶段重签用
          flutter build ipa --release --export-options-plist=ios/exportOptionsAppStore.plist
    artifacts:
      - app/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - codemagic@tic.cc   # TODO: 改为你的邮箱，构建失败/成功时通知

  macos-release:
    name: macOS Release Build
    max_build_duration: 60
    instance_type: mac_pro_m2   # macOS 构建
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      # 与 ios-release 相同：Podfile 存在时走 CocoaPods，避免 Flutter 3.47 默认 SPM 冲突
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Flutter pub get
        working_directory: app
        script: |
          flutter pub get
      - name: Build macOS App
        working_directory: app
        script: |
          flutter build macos --release
          # 顺手把 CLI 也编一份（macOS 版只能在 mac 上编译）
          dart compile exe ../cli/bin/einz_tui.dart -o build/einz-macos
    artifacts:
      - app/build/macos/Build/Products/Release/*.app
      - app/build/einz-macos
    publishing:
      email:
        recipients:
          - codemagic@tic.cc

  windows-release:
    name: Windows Release Build
    max_build_duration: 60
    instance_type: windows_x2   # Windows 构建，需要 billing
    environment:
      flutter: stable
    scripts:
      - name: Flutter pub get
        working_directory: app
        script: |
          flutter pub get
      - name: Build Windows App
        working_directory: app
        script: |
          flutter build windows --release
          # 产物是散装目录（exe + dll + data），压成 zip 方便分发
          cd build/windows/x64/runner/Release
          7z a -r ../einz-windows.zip ./*
      - name: Build Windows CLI
        working_directory: cli
        script: |
          dart compile exe bin/einz_tui.dart -o build/einz.exe
    artifacts:
      - app/build/windows/x64/runner/*.zip
      - cli/build/einz.exe
    publishing:
      email:
        recipients:
          - codemagic@tic.cc
