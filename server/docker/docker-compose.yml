# Einz 服务端单机部署（2026-10-24 合并版）——三种入口形态，用 server/docker/.env
# 里的 COMPOSE_PROFILES 开关切换（可组合，逗号分隔）：
#
#   · 不带 COMPOSE_PROFILES（默认）= 无内置 Caddy：宿主机跑系统级 Caddy（systemd），
#     由它反代到本服务的 127.0.0.1:3000；本 compose 不起 Caddy 容器、不占 80/443。
#     系统级 Caddy 配置示例（/etc/caddy/Caddyfile）：
#        private.example.com {
#            reverse_proxy 127.0.0.1:3000
#            encode gzip
#            header {
#                Strict-Transport-Security "max-age=31536000; includeSubDomains"
#                X-Content-Type-Options "nosniff"
#            }
#        }
#     （WS 升级由 reverse_proxy 自动处理）
#
#   · COMPOSE_PROFILES=caddy = 内置 Caddy 容器：caddy 服务占 80/443 做总入口
#     （TLS 自动签发），server 只在对内网络暴露。启用步骤：
#       1) cp ../Caddyfile.example ../Caddyfile 并把 private.example.com 改成真实域名；
#       2) 在 .env 里加一行 COMPOSE_PROFILES=caddy；
#       3) docker compose up -d
#     此形态下 127.0.0.1:3000 仍会在宿主回环暴露（无外部暴露，便于排障/直连）。
#
#   · COMPOSE_PROFILES=cftunnel = 中国双入口：系统级 Caddy 服备案域名（回环反代）
#     + cloudflared 隧道服境外域名（无备案、CF 边缘终止 TLS）。拓扑：
#       境内用户 ──► einz.yuanjinx.com（备案）──► 系统级 Caddy ──► 127.0.0.1:3000
#       境外用户 ──► einz.tic.cc（无备案）──► Cloudflare 边缘 ──► cloudflared 隧道
#                                                               └──► server:3000
#     两个入口指向同一台 origin（同一 SQLite 库），App/CLI 候选列表并发探测、谁快
#     用谁；**绝不要两边各跑一套库**。启用步骤：
#       1) Cloudflare 建隧道（dash.cloudflare.com → Networking → Tunnels）：
#          Create a tunnel → 选 Docker → 命名（如 einz-cn）→ 复制 token；
#          该隧道 → Routes → Add route → Published application：
#            Subdomain: einz   Domain: tic.cc
#            Service URL: http://server:3000   （协议 HTTP）
#          ⚠ CF 2026 版把 "Public Hostname" 改名成了 "Routes → Add route →
#            Published application"；不建这条路由，连接器即使 Registered 也一律 502。
#          ⚠ URL 写容器名 server——cloudflared 与 server 在本 compose 的 einz 网络内；
#            不要写 caddy:443，CF 已在边缘终止客户端 TLS。
#          ⚠ 先删 DNS 里指向 127.0.0.1 的旧 A 记录：同一主机名已有记录会建不了 CNAME。
#       2) server/docker/.env 里补一行（.env 已在 .gitignore，不入库；改 token 要
#          **替换**旧行，不要追加第二条）：
#            CF_TUNNEL_TOKEN=<第 1 步复制的 token>
#          同时确认 EINZ_DB_BACKUP_KEY 已由 `bash server/docker/env.sh` 生成。
#       3) 系统级 Caddy（/etc/caddy/Caddyfile）配备案域名站点，示例见顶部默认形态；
#       4) 在 .env 里加一行 COMPOSE_PROFILES=cftunnel，docker compose up -d；
#          查看隧道连接：docker compose logs -f cloudflared
#          （期望 4 条 "Registered tunnel connection"）。
#     ⚠ 中国大陆对 UDP/QUIC 常有干扰：cloudflared 已固定 --protocol http2
#       （强制走 TCP 443）；若仍反复掉线再排查本地网络。
#
# ⚠ 形态互斥：内置 caddy（占宿主 80/443）与系统级 Caddy（也占宿主 80/443）二选一，
#   **别给同一个域名同时配两套**（会抢端口/打证书架）。caddy 与 cftunnel 可组合
#   （COMPOSE_PROFILES=caddy,cftunnel：内置 Caddy 服备案域名 + 隧道服境外域名）。
#   若 VPS 上还留着合并前的独立 docker-compose.nocaddy.cftunnel.yml，**不要与新
#   版同时启动**（都发布 127.0.0.1:3000，会抢端口）。
#
# 历史：合并前是 docker-compose.nocaddy.yml / docker-compose.withcaddy.yml /
# docker-compose.nocaddy.cftunnel.yml 三个文件（语义原样保留：默认形态 = 原
# nocaddy，caddy = 原 withcaddy，cftunnel = 原 cftunnel 变体）。
#
# 注：**配置文件是可选的**——设备与空间都在库里（v1 的静态白名单 config.json 已废），
#     `../config`（= server/config/，与 Node dev 共用）里现在只放 `serverConfig.json`
#     （当前字段：maxSpaces，改后重启
#     生效）；目录为空或文件缺失都照常启动（走默认值）。
services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      # 服务端配置文件（可选）：宿主机 ../config/serverConfig.json（= server/config/）→ 容器 /config/。
      # 文件缺失时服务端按默认值启动（当前唯一字段 maxSpaces：0=不限 / n=上限）。
      - EINZ_CONFIG=/config/serverConfig.json
      - EINZ_DB=/data/einz.sqlite.db
      # 头像目录：默认路径是容器内 /app/data/avatars（**不在任何卷里**），
      # 每次 `docker compose up -d --build server` 重建容器就会被清空——
      # 表现是所有人的头像同时消失（2026-09-26 实测踩坑）。必须指到卷上。
      - EINZ_AVATARS=/data/avatars
      - EINZ_FILES=/data/files
      # 备份密钥（server 备份/恢复归档 AES-256-GCM 用，docs/DEPLOYMENT.md §5）：
      # 由 compose 自动读取本目录 .env 文件提供（server/docker/.env 已在 .gitignore，
      # 不入库、git pull 不覆盖）。未配置时 npm run backup 会拒绝执行（防明文备份）。
      - EINZ_DB_BACKUP_KEY=${EINZ_DB_BACKUP_KEY}
      #################################
      # 邮件通知（2026-10-01）：留空 = 功能整体关闭（聊天照常，只是不发信）。
      # 值同样来自 server/docker/.env；发件地址必须是 Email Delivery 里登记过的
      # approved sender，且域名要配 SPF/DKIM，否则落垃圾箱。
      - EINZ_SMTP_HOST=${EINZ_SMTP_HOST}
      - EINZ_SMTP_PORT=${EINZ_SMTP_PORT}
      - EINZ_SMTP_USER=${EINZ_SMTP_USER}
      - EINZ_SMTP_PASS=${EINZ_SMTP_PASS}
      - EINZ_MAIL_FROM=${EINZ_MAIL_FROM}
      #################################
      # 服务端转写（方案 D'，PROTOCOL.md §6.3）：二进制在镜像内 /opt/whisper，
      # 模型走卷（首次部署前放一份 ggml 模型到 ../models/whisper.cpp/models/（= server/models/whisper.cpp/models/），见
      # aimemo/whisperDeploy.zhcn.md §3）。两个变量都配 = 转写启用；
      # 模型文件缺失时 whisper-cli 启动即失败 → 503 TRANSCRIBE_FAILED。
      - EINZ_WHISPER_BIN=/opt/whisper/whisper-cli
      - EINZ_WHISPER_MODEL=/opt/whisper/models/ggml-small.bin
      #################################
      # sensevoice 引擎（sherpa-onnx node addon，进程内识别）：模型目录在容器内
      # 固定为 /opt/sensevoice（下方卷的挂载点，宿主侧 server/models/sensevoice）。
      # 宿主目录缺文件 = 该引擎未配置 → 自动回落 whisper（ graceful 退场）。
      - EINZ_SENSEVOICE_MODEL=/opt/sensevoice
      #################################
      # 转写引擎选择（2026-10-24）：sensevoice / whisper，留空 = 自动（sensevoice
      # 配了就用，否则 whisper）。值经 .env 插值——裸 node 与 Docker 共用同一
      # 语义；想固定引擎就在 .env 里写 EINZ_ASR_ENGINE=whisper（或 sensevoice）。
      - EINZ_ASR_ENGINE=${EINZ_ASR_ENGINE:-}
    ports:
      # 仅宿主回环可见：系统级 Caddy 反代到这里，不对外直开；内置 Caddy 形态下
      # 此绑定同样只在回环（排障/直连用），不构成外部暴露。
      - "127.0.0.1:3000:3000"
    volumes:
      - ../config:/config:ro
      - ../data:/data
      - ../models/whisper.cpp/models:/opt/whisper/models:ro
      - ../models/sensevoice:/opt/sensevoice:ro # sensevoice 模型（缺文件则该引擎退场）
    networks:
      - einz

  # 内置 Caddy（可选，profile 门控）：默认不起——在 .env 里写
  # COMPOSE_PROFILES=caddy 即启用。与 server 同网络，反代 server:3000。
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - einz
    depends_on:
      - server

  # Cloudflare 隧道连接器（可选，profile 门控）：默认不起——在 .env 里写
  # COMPOSE_PROFILES=cftunnel 即启用。承载无备案的境外域名（如 einz.tic.cc），
  # 只**出站**连 Cloudflare、不开任何入站端口；tic.cc 从不解析到中国 IP，
  # 故不涉及备案。与系统级 Caddy（服备案域名）分工，见文件头拓扑图。
  # ⚠ 使用前必须：① CF 控制台建隧道与 Published application 路由
  #   （Service URL 写 http://server:3000）；② .env 里配 CF_TUNNEL_TOKEN
  #   （未配 = 容器启动即失败，报错明确不静默）。
  # ⚠ command 固定 --protocol http2：中国大陆对 UDP/QUIC 常有干扰，强制走 TCP 443。
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["cftunnel"]
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      # :- 兜底：默认形态（不启用本 profile）不刷未设置警告；启用后未配 token
      # 则 cloudflared 启动即失败（报错明确，不静默）。
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:-}
    depends_on:
      - server
    networks:
      - einz

volumes:
  caddy_data:
  caddy_config:

networks:
  einz:
