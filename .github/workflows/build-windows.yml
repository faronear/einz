name: build-windows

on:
  # 手动触发：在 GitHub 仓库页 Actions 标签页点 "Run workflow"
  workflow_dispatch:
  # 也可以改成 push 自动触发，需要时取消下面注释
  # push:
  #   branches: [main]
  #   paths: ['app/**', '.github/workflows/build-windows.yml']

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app   # Flutter 工程在仓库的 app/ 子目录
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build windows --release

      # 把构建产物打成 zip 上传为 Artifact，构建完成后在 run 页面下载
      - name: Package build output
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath einz-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: einz-windows
          path: app/einz-windows.zip
