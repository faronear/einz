# Einz 多平台构建（GitHub Actions）
#
# 覆盖 Android / iOS / macOS / Windows 四个目标，触发方式：
#   - workflow_dispatch：手动选择单个平台（push tag 自动构建暂未启用，避免每次 push 都跑 CI）
#   - push tag（v*）：全平台构建（需要时取消下面注释）
#
# 说明：
#   - Android / Windows / macOS 无签名要求，直接出包
#   - iOS 需要 secrets：IOS_P12_CERTIFICATE(Base64) + IOS_P12_PASSWORD + IOS_PROVISIONING_PROFILE(Base64)
#     未配置 secrets 时 iOS job 自动跳过
#   - macOS 计费 10x、Windows 2x，注意私有仓库额度
name: Multi Platform Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all = android+windows+macos)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - macos
          - windows
  # push:
  #   tags:
  #     - 'v*'

jobs:
  android:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Patch pub cache (AGP 9 compat)
        working-directory: app
        run: bash ../scripts/patchPubCache.sh
      - name: Build APK
        working-directory: app
        env:
          # 公共 runner 仅 7GB 内存：覆盖 gradle.properties 里的 -Xmx8G（按本机大内存设置），
          # 避免 OOM killer 杀 Gradle（曾表现为跑约 16 分钟后 exit 143）
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G"
        run: |
          # 版本号 yymm.ddhh.mm / 构建号 yymmddhh，各平台统一（唯一出处 scripts/appVersion.js）
          eval "$(node ../scripts/appVersion.js)"
          flutter build apk --release --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER"
      - name: Rename APK
        working-directory: app
        run: mv build/app/outputs/flutter-apk/app-release.apk einz-app-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: einz-android
          path: app/einz-app-android.apk
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: app/einz-app-android.apk

  windows:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Build Windows
        working-directory: app
        # 用 bash 而不是默认的 PowerShell，好跟其余 job 共用 scripts/appVersion.js。
        # 只传版本号不传构建号：FILEVERSION 四个字段各 16 位（≤65535），
        # 构建号 26091810 塞不进去，不传则 flutter 取 0。
        shell: bash
        run: |
          eval "$(node ../scripts/appVersion.js)"
          flutter build windows --release --build-name "$APP_BUILD_NAME"
      - name: Fetch libsodium.dll
        # GUI（package:sodium FFI）和 CLI 运行时都要 libsodium.dll，Flutter/Dart 打包不会自动带上，
        # 官方也没集成进产物——从 libsodium 官方 release 下载 MSVC 预编译包分发
        shell: pwsh
        run: |
          curl.exe -L -o libsodium-msvc.zip https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-msvc.zip
          Expand-Archive libsodium-msvc.zip -DestinationPath libsodium-msvc
          # 实际包内路径：libsodium/x64/Release/v142/dynamic/libsodium.dll（顶层还有 libsodium/ 目录 + dynamic 子目录）
          Copy-Item libsodium-msvc/libsodium/x64/Release/v142/dynamic/libsodium.dll app/build/windows/x64/runner/Release/
          New-Item -ItemType Directory -Force _release.gitomit
          Copy-Item libsodium-msvc/libsodium/x64/Release/v142/dynamic/libsodium.dll _release.gitomit/
      - name: Zip release folder
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath einz-gui-windows.zip
      - name: Build CLI
        working-directory: cli
        run: |
          dart pub get
          mkdir -p ../_release.gitomit
          dart compile exe bin/einz_tui.dart -o ../_release.gitomit/einz-tui-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: einz-windows
          path: |
            einz-gui-windows.zip
            _release.gitomit/einz-tui-windows.exe
            _release.gitomit/libsodium.dll
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          # 每次构建覆盖 latest release，访客始终在同一地址取最新包
          make_latest: true
          files: |
            einz-gui-windows.zip
            _release.gitomit/einz-tui-windows.exe
            _release.gitomit/libsodium.dll

  macos:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Disable Swift Package Manager
        # 与 codemagic ios-release 相同：Podfile 存在时走 CocoaPods，避免 Flutter 3.47 默认 SPM 冲突
        run: flutter config --no-enable-swift-package-manager
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Build macOS App
        working-directory: app
        run: |
          # CI 无开发证书/profile：临时禁用签名再构建（工程文件为 Automatic+Team，
          # flutter build 传参会覆盖环境变量，故直接改 pbxproj；不改仓库内文件）
          sed -i '' -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
                    -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/' \
                    -e 's/DEVELOPMENT_TEAM = CQ6733CTMV;//' \
                    macos/Runner.xcodeproj/project.pbxproj
          eval "$(node ../scripts/appVersion.js)"
          flutter build macos --release --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER"
      - name: Re-sign ad-hoc without restricted entitlements
        working-directory: app
        run: |
          # ad-hoc 签名不能带 keychain-access-groups / get-task-allow 这类需真实身份背书的
          # 受限 entitlement，否则内核 AMFI 判 Invalid Signature，launchd 启动即 SIGKILL
          # （表现为"应用程序无法打开"，崩溃日志 indicator=Taskgated Invalid Signature）。
          # 删除受限项后对 frameworks + app 重打 ad-hoc 签名。
          ENT=macos/Runner/Release.entitlements
          plutil -remove keychain-access-groups "$ENT" || true
          plutil -remove com.apple.security.get-task-allow "$ENT" || true
          find build/macos/Build/Products/Release/einz.app/Contents/Frameworks -name "*.framework" \
            -exec codesign -f -s - --timestamp=none {} \;
          codesign -f -s - --timestamp=none --entitlements "$ENT" \
            build/macos/Build/Products/Release/einz.app
          codesign --verify -v build/macos/Build/Products/Release/einz.app
      - name: Zip app bundle
        # 用 GITHUB_WORKSPACE 绝对路径落盘（曾数错相对层级两次，导致上传的 zip 里只有 TUI）
        run: cd app/build/macos/Build/Products/Release && zip -r -y "$GITHUB_WORKSPACE/einz-gui-macos.zip" einz.app
      - uses: actions/upload-artifact@v4
        with:
          name: einz-macos
          path: |
            einz-gui-macos.zip
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: |
            einz-gui-macos.zip

  # macOS 桌面 CLI（einz-tui-macos）通用二进制：
  # dart compile exe 只产出宿主架构，且 Dart 不支持 macOS 跨架构编译，
  # 所以分别在 Intel(macos-13) 与 Apple Silicon(macos-latest) 上各编一份，
  # 再用 lipo 合成 arm64+x64 通用二进制，Intel Mac 才能跑（否则 Bad CPU type）。
  macos-cli:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: x64
          - runner: macos-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build CLI
        working-directory: cli
        run: |
          dart pub get
          mkdir -p ../_release.gitomit
          dart compile exe bin/einz_tui.dart -o ../_release.gitomit/einz-tui-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: einz-tui-macos-${{ matrix.arch }}
          path: _release.gitomit/einz-tui-${{ matrix.arch }}

  macos-cli-combine:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    needs: macos-cli
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Combine universal binary
        run: |
          # download-artifact@v4 会按 artifact 名建子目录
          lipo -create -output einz-tui-macos \
            artifacts/einz-tui-macos-x64/einz-tui-x64 \
            artifacts/einz-tui-macos-arm64/einz-tui-arm64
          lipo -info einz-tui-macos
      - uses: actions/upload-artifact@v4
        with:
          name: einz-tui-macos
          path: einz-tui-macos
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: einz-tui-macos

  ios:
    if: ${{ github.event_name == 'push' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        id: secrets
        env:
          HAS_P12: ${{ secrets.IOS_P12_CERTIFICATE != '' }}
        run: echo "configured=${{ env.HAS_P12 }}" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: steps.secrets.outputs.configured == 'true'
        with:
          channel: stable
          cache: true
      - name: Install signing certificate
        if: steps.secrets.outputs.configured == 'true'
        env:
          IOS_P12_CERTIFICATE: ${{ secrets.IOS_P12_CERTIFICATE }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$IOS_P12_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain
      - name: Install provisioning profile
        if: steps.secrets.outputs.configured == 'true'
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
      - name: Build iOS IPA (unsigned, for device testing)
        if: steps.secrets.outputs.configured != 'true'
        working-directory: app
        run: |
          eval "$(node ../scripts/appVersion.js)"
          flutter build ios --release --no-codesign --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER"
      - name: Build iOS IPA (signed)
        if: steps.secrets.outputs.configured == 'true'
        working-directory: app
        run: |
          eval "$(node ../scripts/appVersion.js)"
          flutter build ipa --release \
            --build-name "$APP_BUILD_NAME" \
            --build-number "$APP_BUILD_NUMBER" \
            --export-options-plist=ios/exportOptionsAdhoc.plist
      - uses: actions/upload-artifact@v4
        with:
          name: einz-ios
          path: |
            app/build/ios/ipa/*.ipa
            app/build/ios/iphoneos/Runner.app
