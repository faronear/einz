# Einz 多平台构建（GitHub Actions）
#
# 覆盖 Android / iOS / macOS / Windows / Linux 五个目标，另在 Windows / macOS /
# Linux 上顺带出 TUI（einz-tui-windows / einz-tui-macos-* / einz-tui-linux-x64，
# 见各 *-cli job）。触发方式（老板 2026-09-21 定）：
#   - push main：自动跑全平台（纯文档改动被 paths-ignore 挡掉，不烧额度）
#   - workflow_dispatch：手动选择单个平台
#   - push tag v*：全平台（路径过滤对 tag 不生效，发版一律全跑）
#
# 说明：
#   - Android / Windows 无签名要求，直接出包
#   - macOS 分两个渠道：配了 Developer ID secrets = -dist（Developer ID 签名 +
#     公证 + staple，**沙盒**，异机双击即用）；未配 = -dev（ad-hoc，仅本机调试）
#     需要的 secrets：MACOS_DEVID_P12(Base64) + MACOS_DEVID_P12_PASSWORD +
#     MACOS_NOTARY_APPLE_ID + MACOS_NOTARY_PASSWORD + MACOS_NOTARY_TEAM_ID
#   - iOS 只出 **App Store 包**（老板 2026-09-21：CI 不留 Ad Hoc 分支与产物——Ad Hoc
#     只有白名单里那几台能装，本机 buildIos.sh adhoc 就够；CI 要的是能上 TestFlight
#     的那一份）。secrets：IOS_P12_CERTIFICATE(Base64) + IOS_P12_PASSWORD +
#     IOS_APPSTORE_PROVISIONING_PROFILE（"Einz Dist Appstore"，无设备列表）。
#     ⚠️ 工程 Runner 的 Release 签名写的是 **Ad Hoc** 描述文件（archive 阶段按工程设置
#     走，`--export-options-plist` 只管导出阶段），CI 会在工作区里把它改指 App Store，
#     所以 CI **不需要** Ad Hoc 那份描述文件（2026-09-21 老板实测：删掉它会 archive 报
#     "No profile ... matching 'Einz Dist Adhoc' found"）。
#     **构建成功即自动上传 TestFlight**（老板 2026-09-21），另需
#     ASC_API_KEY_ID / ASC_API_ISSUER / ASC_P8_KEY；缺 ASC 会明确失败（不留"绿但没传"）。
#     缺**签名** secrets 时 job 照常被调度但**干净跳过构建**（只打印一行提示，不红）
#   - macOS 计费 10x、Windows 2x，注意私有仓库额度
name: Multi Platform Build

on:
  # 手动：Actions 页面 Run workflow，可选单个平台（inputs 必须保留——job 的 if 依赖
  # `inputs.platform`；只解开 workflow_dispatch 而删掉 inputs，手动触发会零 job）
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all = android+windows+macos+linux)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - macos
          - windows
          - linux
  push:
    # 推 main 就自动跑（老板 2026-09-21）：改代码即验证。
    # 注意 `tags` 与 `branches` 是两个独立过滤：只写 tags 时**推分支不会触发**
    # （此前就是这么写的，所以 push main 一直不跑，见 124ab0f）。
    branches:
      - main
    # 纯文档/记忆改动不烧额度（私有仓库 macOS 计费 10x、Windows 2x）。
    # 注：路径过滤对 tag 推送不生效，即发版 tag 一律触发全平台。
    paths-ignore:
      - 'docs/**'
      - 'aimemo/**'
      - '**.md'
    tags:
      - 'v*'

jobs:
  # 测试先行（方案 B，2026-10-04）：所有出包 job 都 `needs: [test]`——**测试不过就不出包**。
  # 为什么放在这里而不是只靠 testAll.yml：main 推送与 **tag 发版**都得被 gate，而
  # tag 推送不触发 testAll.yml（那是发版前唯一能拦住的时机）。
  # 与之配套：testAll.yml 的 push 排除了 main，免得同一个提交在 main 上跑两遍测试。
  test:
    name: test（analyze + app/cli/server 全部测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # cli 的 analyze/test 用 flutter 自带的 dart（flutter-action 会把它放进 PATH），
      # 所以不必再 setup-dart
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # shared/lib/src/sodium.dart 走 DynamicLibrary.open 找系统 libsodium
      - name: 装 libsodium（app 测试要动态加载）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsodium-dev
      - name: 跑全部测试（scripts/testAll.sh，与本地/CI 其他地方同一份）
        run: scripts/testAll.sh all

  android:
    needs: [test]
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Patch pub cache (AGP 9 compat)
        working-directory: app
        run: bash ../scripts/patchPubCache.sh
      - name: Install Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HAS_STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          # 用**与本地同一把** release keystore 签名（老板 2026-09-21 定）：签名不同的包不能
          # 覆盖安装，而 build.gradle.kts 在没有 key.properties 时会静默退回 debug 签名
          # ——"CI 绿但装不上/与本地包冲突"是最难发现的那种坏，所以这里缺 secrets 直接失败。
          [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEY_ALIAS" ]] \
            || { echo "❌ 缺 ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS（见 docs/CI.md）" >&2; exit 1; }
          [[ "$HAS_STORE_PW" == "true" && "$HAS_KEY_PW" == "true" ]] \
            || { echo "❌ 缺 ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD（见 docs/CI.md）" >&2; exit 1; }
          # keystore 与 properties 都放到工作区之外，别被 artifact / 缓存带走
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/einz-release.jks"
          chmod 600 "$RUNNER_TEMP/einz-release.jks"
          # 口令**不落盘**：gradle 优先读 EINZ_STORE_PASSWORD / EINZ_KEY_PASSWORD 环境变量
          # （build.gradle.kts 的 C3 设计），properties 里只写 keystore 路径与别名
          printf 'storeFile=%s\nkeyAlias=%s\n' \
            "$RUNNER_TEMP/einz-release.jks" "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/android-key.properties"
          echo "EINZ_ANDROID_KEY_PROPERTIES=$RUNNER_TEMP/android-key.properties" >> "$GITHUB_ENV"
          echo "✅ 已装入 release keystore（别名 $ANDROID_KEY_ALIAS）"
      - name: Build APK
        working-directory: app
        env:
          # 公共 runner 仅 7GB 内存：覆盖 gradle.properties 里的 -Xmx8G（按本机大内存设置），
          # 避免 OOM killer 杀 Gradle（曾表现为跑约 16 分钟后 exit 143）
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G"
          # 签名口令走环境变量（gradle 优先于 properties 文件）；见上一步
          EINZ_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EINZ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # 语音通话的 TURN 配置（docs/TURN.md）：配了就带上，没配照出包。
          VOICE_TURN_URLS: ${{ secrets.VOICE_TURN_URLS }}
          VOICE_TURN_USERNAME: ${{ secrets.VOICE_TURN_USERNAME }}
          VOICE_TURN_CREDENTIAL: ${{ secrets.VOICE_TURN_CREDENTIAL }}
        run: |
          # 版本号 yymm.ddhh.mm / 构建号 yymmddhh，各平台统一（唯一出处 scripts/appVersion.js）
          eval "$(node ../scripts/appVersion.js)"
          # 语音通话的 TURN（跨网打洞必需）：有 secrets 就带上，没有也照出包——
          # 只是那个包跨网打不通（不因为缺配置让 CI 变红）
          TURN_DEFINES=()
          if [[ -n "${VOICE_TURN_URLS}" ]]; then
            TURN_DEFINES+=(--dart-define="VOICE_TURN_URLS=${VOICE_TURN_URLS}")
          fi
          if [[ -n "${VOICE_TURN_USERNAME}" ]]; then
            TURN_DEFINES+=(--dart-define="VOICE_TURN_USERNAME=${VOICE_TURN_USERNAME}")
          fi
          if [[ -n "${VOICE_TURN_CREDENTIAL}" ]]; then
            TURN_DEFINES+=(--dart-define="VOICE_TURN_CREDENTIAL=${VOICE_TURN_CREDENTIAL}")
          fi
          flutter build apk --release --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER" "${TURN_DEFINES[@]}"
      - name: Verify APK is signed with the release key
        working-directory: app
        run: |
          # 防"静默退回 debug 签名"：只断言签名者不是 debug，不写死指纹
          # （将来换 keystore 不必改这里）
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          [[ -x "$APKSIGNER" ]] || { echo "❌ 找不到 apksigner（SDK=$SDK）" >&2; exit 1; }
          OUT="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$OUT" | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          if echo "$OUT" | grep -q "CN=Android Debug"; then
            echo "❌ 产物是 debug 签名——release keystore 没生效（查 secrets 与 EINZ_ANDROID_KEY_PROPERTIES）" >&2
            exit 1
          fi
      - name: Rename APK + 旁车 version.txt
        working-directory: app
        # version.txt 与 macos 同款（2026-10-13 定的规矩）：版本号**从产物自己读**
        # （aapt2 读 APK 的 versionName），不重跑 appVersion.js——那是 new Date() 现算的，
        # 生成 txt 的时刻 ≠ 打包时刻，跨分钟就不一致。
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk einz-app-android.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          AAPT2="$(ls -d "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
          [[ -x "$AAPT2" ]] || { echo "❌ 找不到 aapt2（SDK=$SDK）" >&2; exit 1; }
          NAME="$("$AAPT2" dump badging einz-app-android.apk | grep -o "versionName='[^']*'" | head -1 | cut -d"'" -f2)"
          [[ "$NAME" =~ ^[0-9]{4}\.[0-9]{4}\.[0-9]{2}$ ]] || {
            echo "❌ APK versionName 是「$NAME」，不是 yymm.ddhh.mm——flutter 没吃到 --build-name？" >&2
            exit 1
          }
          echo "$NAME" > "$GITHUB_WORKSPACE/einz-app-android.version.txt"
          echo "APK 版本：$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: einz-android
          path: |
            app/einz-app-android.apk
            einz-app-android.version.txt
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: |
            app/einz-app-android.apk
            einz-app-android.version.txt

  windows:
    needs: [test]
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Build Windows
        working-directory: app
        # 用 bash 而不是默认的 PowerShell，好跟其余 job 共用 scripts/appVersion.js。
        # 只传版本号不传构建号：FILEVERSION 四个字段各 16 位（≤65535），
        # 构建号 26091810 塞不进去，不传则 flutter 取 0。
        shell: bash
        run: |
          eval "$(node ../scripts/appVersion.js)"
          flutter build windows --release --build-name "$APP_BUILD_NAME"
      - name: Fetch libsodium.dll
        # GUI（package:sodium FFI）和 CLI 运行时都要 libsodium.dll，Flutter/Dart 打包不会自动带上，
        # 官方也没集成进产物——从 libsodium 官方 release 下载 MSVC 预编译包。
        # 解压到仓库根（libSodium-msvc/），后续 GUI zip 和 CLI zip 两个打包步骤各自取用
        shell: pwsh
        run: |
          curl.exe -L -o libsodium-msvc.zip https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-msvc.zip
          Expand-Archive libsodium-msvc.zip -DestinationPath libsodium-msvc
          # 实际包内路径：libsodium/x64/Release/v142/dynamic/libsodium.dll（顶层还有 libsodium/ 目录 + dynamic 子目录）
          Copy-Item libsodium-msvc/libsodium/x64/Release/v142/dynamic/libsodium.dll app/build/windows/x64/runner/Release/
      - name: Zip release folder + 旁车 version.txt
        # version.txt 与 macos 同款：版本号从产物自己读。Windows GUI 的版本在
        # einz.exe 的 PE 资源里（--build-name 写入 FILEVERSION；二进制名跟
        # app/windows/CMakeLists.txt 的 BINARY_NAME，不是默认的 runner.exe），
        # 用 PowerShell 读（Get-Item).VersionInfo。Build step 传的是完整
        # --build-name（三段），所以版本就是 yymm.ddhh.mm，校验规则与 macos 一致。
        shell: pwsh
        run: |
          $name = (Get-Item app/build/windows/x64/runner/Release/einz.exe).VersionInfo.FileVersion
          if ($name -notmatch '^\d{4}\.\d{4}\.\d{2}$') {
            throw "❌ einz.exe 版本是「$name」，不是 yymm.ddhh.mm——flutter 没吃到 --build-name？"
          }
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath einz-app-windows.zip
          Set-Content -Path einz-app-windows.version.txt -Value $name
          Write-Output "Windows GUI 版本：$name"
      - name: Build CLI
        working-directory: cli
        # Windows 默认 shell 是 PowerShell：mkdir 是 New-Item 的别名，-p 会被解析成
        # -Path，目录已存在即报错；用 New-Item -Force 等价 bash 的 mkdir -p
        run: |
          dart pub get
          # exe + libsodium.dll 合并打进 einz-tui-windows.zip（exe 运行时按同目录找 dll），
          # 用户下载解压即可运行，无需再单独下 dll
          New-Item -ItemType Directory -Force ../_release.gitomit/einz-tui-windows
          dart compile exe bin/einz_tui.dart -o ../_release.gitomit/einz-tui-windows/einz-tui-windows.exe
          Copy-Item ../libsodium-msvc/libsodium/x64/Release/v142/dynamic/libsodium.dll ../_release.gitomit/einz-tui-windows/
          Compress-Archive -Path ../_release.gitomit/einz-tui-windows/* -DestinationPath ../einz-tui-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: einz-windows
          path: |
            einz-app-windows.zip
            einz-app-windows.version.txt
            einz-tui-windows.zip
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          # 每次构建覆盖 latest release，访客始终在同一地址取最新包
          make_latest: true
          files: |
            einz-app-windows.zip
            einz-app-windows.version.txt
            einz-tui-windows.zip

  macos:
    needs: [test]
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check Developer ID secrets
        id: devid
        env:
          HAS_P12: ${{ secrets.MACOS_DEVID_P12 != '' }}
        run: echo "configured=${{ env.HAS_P12 }}" >> "$GITHUB_OUTPUT"
      - name: Import Developer ID certificate
        if: steps.devid.outputs.configured == 'true'
        env:
          MACOS_DEVID_P12: ${{ secrets.MACOS_DEVID_P12 }}
          MACOS_DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
        run: |
          echo "$MACOS_DEVID_P12" | base64 --decode > devid.p12
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          security import devid.p12 -k build.keychain -P "$MACOS_DEVID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain
      - name: Disable Swift Package Manager
        # 与 codemagic ios-release 相同：Podfile 存在时走 CocoaPods，避免 Flutter 3.47 默认 SPM 冲突
        run: flutter config --no-enable-swift-package-manager
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Build macOS App
        working-directory: app
        run: |
          # CI 无开发证书/profile：临时禁用签名再构建（工程文件为 Automatic+Team，
          # flutter build 传参会覆盖环境变量，故直接改 pbxproj；不改仓库内文件）
          # 配了 Developer ID secrets 时也先这样出未签名产物，签名统一在下一步做
          # （无 profile 时 Xcode 签名会嵌/要求 provisioning，直接禁干净）
          sed -i '' -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
                    -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/' \
                    -e 's/DEVELOPMENT_TEAM = CQ6733CTMV;//' \
                    macos/Runner.xcodeproj/project.pbxproj
          eval "$(node ../scripts/appVersion.js)"
          flutter build macos --release --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER"
      - name: Sign (Developer ID + notarize + staple)
        if: steps.devid.outputs.configured == 'true'
        working-directory: app
        env:
          MACOS_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.MACOS_NOTARY_KEYCHAIN_PROFILE }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER: ${{ secrets.ASC_API_ISSUER }}
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
        run: |
          APP=build/macos/Build/Products/Release/einz.app
          # flutter 可能嵌入本机 profile（CI 上通常没有，防御性删除）。Developer ID
          # 分发不需要也不该带 profile——去 profile 后 entitlements 里也不能有任何
          # 需 profile 背书的项（见下面 ENT 与 macos/Runner/Release.entitlements）
          rm -f "$APP/Contents/embedded.provisionprofile"
          # 直接用仓库里的 Release.entitlements（沙盒 + 出站网络 + 用户选择文件三个
          # 布尔项），**不要**再像以前那样用 python 剥掉 app-sandbox：
          # 当初「沙盒 + Keychain + Developer ID 三角死锁」的真凶是 flutter_secure_storage
          # 默认走数据保护 Keychain（要 keychain-access-groups，而该 entitlement 只能由
          # provisioning profile 授权 → 无 profile 时每次 SecItem* 都是 -34018）；桌面端
          # 已改成文件型 Keychain（secure_store.dart 的 usesDataProtectionKeychain: false），
          # 沙盒与 Developer ID 从此完全兼容，不需要去沙盒。详见 aimemo/worklog.md 2026-09-20。
          ENT=macos/Runner/Release.entitlements
          IDENTITY="Developer ID Application"
          find "$APP/Contents/Frameworks" -name "*.framework" \
            -exec codesign -f -s "$IDENTITY" --timestamp --options runtime {} \;
          codesign -f -s "$IDENTITY" --timestamp --options runtime --entitlements "$ENT" "$APP"
          codesign --verify -v --strict "$APP"
          # 公证凭据存入临时 keychain profile（secrets 不落日志）。
          # **优先 ASC API key**（与 iOS 上传同一套 secrets）：2026-10-22/23 连续两次
          # 用 Apple ID + App 密码公证后，stapler 查询公证记录持续 "CloudKit query
          # ... Record not found"（run 39729360308 / 39875227075，重试 3 分钟仍查不到
          # ——不是同步延迟，是 Apple ID 私有 CloudKit 库查询通道不稳）；改用 ASC
          # key 后 stapler 走 App Store Connect API 查询，社区普遍反馈该问题消失。
          # 缺 ASC secrets 时回退 Apple ID 方式（旧行为）。
          mkdir -p ~/private_keys
          printf '%s' "$ASC_P8_KEY" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          if [[ -n "$ASC_API_KEY_ID" && -n "$ASC_API_ISSUER" ]]; then
            xcrun notarytool store-credentials notary-ci \
              --key "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
              --key-id "$ASC_API_KEY_ID" \
              --issuer "$ASC_API_ISSUER"
          else
            echo "⚠️ 未配 ASC secrets，回退 Apple ID + App 密码公证（staple 可能遇到 Record not found）"
            xcrun notarytool store-credentials notary-ci \
              --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --team-id "$MACOS_NOTARY_TEAM_ID" \
              --password "$MACOS_NOTARY_PASSWORD"
          fi
          # zip 必须用 ditto（保留 Frameworks 符号链接，zip 命令会破坏结构导致公证失败）
          ditto -c -k --keepParent --sequesterRsrc "$APP" notary-upload.zip
          # **必须解析 submit 的 JSON status**：公证被判 Invalid 时 notarytool 也
          # exit 0（electron/notarize 社区同款坑），只看退出码会一路走到 stapler，
          # 得到的只是不知所云的 "CloudKit query ... Record not found"——Invalid 的
          # 公证不发布 ticket，重试多久都查不到（run 39729360308/39875227075/39876828935
          # 三连败的真相）。status 非 Accepted 当场打 notarytool log 拿 Apple 的拒绝原因。
          SUBMIT_JSON=$(xcrun notarytool submit notary-upload.zip --keychain-profile notary-ci --wait --output-format json)
          echo "$SUBMIT_JSON"
          STATUS=$(printf '%s' "$SUBMIT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
          SUB_ID=$(printf '%s' "$SUBMIT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')
          if [ "$STATUS" != "Accepted" ]; then
            echo "❌ 公证未通过（status=$STATUS）——Apple 拒绝原因："
            xcrun notarytool log "$SUB_ID" --keychain-profile notary-ci || true
            exit 1
          fi
          # stapler 要到 Apple CloudKit 查公证记录；submit --wait 成功后记录同步到
          # stapler 侧偶发延迟（"CloudKit query ... Record not found"，2026-10-22
          # CI run 39729360308 实测），加退避重试——通常 1-2 分钟内可查。
          STAPLE_OK=0
          for i in 1 2 3 4 5 6; do
            if xcrun stapler staple "$APP"; then STAPLE_OK=1; break; fi
            echo "staple attempt $i failed; notary record not queryable yet, waiting 30s..."
            sleep 30
          done
          [ "$STAPLE_OK" = 1 ] || { echo "staple failed after 6 attempts"; exit 1; }
          xcrun stapler validate "$APP"
          spctl -a -vv -t exec "$APP"
          rm -f notary-upload.zip
      - name: Re-sign ad-hoc without restricted entitlements
        if: steps.devid.outputs.configured != 'true'
        working-directory: app
        run: |
          # 未配 Developer ID secrets 的兜底：只打 ad-hoc 签名（沙盒照常保留）。
          # 之所以能直接带 Release.entitlements：它已只含三个布尔项（沙盒/出站网络/
          # 用户选择文件），没有 keychain-access-groups、get-task-allow 这类需真实
          # 身份背书的受限 entitlement——带那些才会被内核 AMFI 判 Invalid Signature、
          # launchd 启动即 SIGKILL（表现为"应用程序无法打开"）。
          # **不要加 `--options runtime`**：ad-hoc 签名没有 Team ID，Hardened Runtime
          # 会打开 Library Validation，dyld 加载内嵌 framework 时报
          # "mapping process and mapped file have different Team IDs" 直接起不来
          # （2026-09-20 本机实测对比过）。Developer ID 那条能开 runtime 是因为所有
          # 组件同属一个 Team ID，ad-hoc 没有这个前提。
          ENT=macos/Runner/Release.entitlements
          find build/macos/Build/Products/Release/einz.app/Contents/Frameworks -name "*.framework" \
            -exec codesign -f -s - --timestamp=none {} \;
          codesign -f -s - --timestamp=none --entitlements "$ENT" \
            build/macos/Build/Products/Release/einz.app
          codesign --verify -v build/macos/Build/Products/Release/einz.app
      - name: Zip app bundle
        # 命名与本地打包对齐（buildMacos.sh）：配 secrets = -dist（Developer ID 可分发），
        # 未配 = -dev（ad-hoc 兜底）；CI 无时间串，版本号（APP_BUILD_NAME）已够区分构建。
        # 同时落一个 *.version.txt 旁车文件（内容就是版本号一行）：Release 资产名固定
        # 不带版本号（固定名才能覆盖老文件、不堆积多版本），自动更新脚本
        # （scripts/updateMacosApp.js）先拉这个小文件比版本，新了才下载几百 MB 的 zip
        run: |
          SUFFIX=${{ steps.devid.outputs.configured == 'true' && 'dist' || 'dev' }}
          # 版本号**从产物自己的 Info.plist 读**（plutil -extract 在 iOS job 已有同款
          # 用法），不现场重跑 appVersion.js：版本号是 new Date() 现算的，Build step
          # 与本 step 之间隔着签名 + 公证（Apple 扫描约 2–10 分钟），两次调用只要跨过
          # 分钟边界就不一致——version.txt 比 zip 内版本大几分钟，updateMacosApp.js
          # 装完仍认为"远程更新"，每次都重下几百 MB 且永不收敛
          # （2026-10-13 实测：zip 2610.1310.17 / txt 2610.1310.22）。
          # Info.plist 是产物的 ground truth，旁车文件必须与它逐字一致。
          # 本 step 无 working-directory（默认仓库根），路径从仓库根写。
          APP_DIR=app/build/macos/Build/Products/Release
          NAME="$(/usr/bin/plutil -extract CFBundleShortVersionString raw "$APP_DIR/einz.app/Contents/Info.plist")"
          # 防"绿但坏"：flutter 没吃到 --build-name 时这里当场炸，别让写错的版本号
          # 流到 Release（updateMacosApp.js 的版本比较只认 yymm.ddhh.mm）
          [[ "$NAME" =~ ^[0-9]{4}\.[0-9]{4}\.[0-9]{2}$ ]] || {
            echo "❌ 产物 Info.plist 版本号是「$NAME」，不是 yymm.ddhh.mm——flutter 没吃到 --build-name？" >&2
            exit 1
          }
          cd "$APP_DIR"
          zip -r -y "$GITHUB_WORKSPACE/einz-app-macos-$SUFFIX.zip" einz.app
          echo "$NAME" > "$GITHUB_WORKSPACE/einz-app-macos-$SUFFIX.version.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: einz-macos
          path: |
            einz-app-macos-*.zip
            einz-app-macos-*.version.txt
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: |
            einz-app-macos-*.zip
            einz-app-macos-*.version.txt

  # macOS 桌面 CLI（einz-tui-macos）分架构两个产物：
  # dart compile exe 只产出宿主架构，且 Dart 不支持 macOS 跨架构编译，
  # 所以分别在 Intel 与 Apple Silicon runner 上各编一份，直接分架构提供下载
  # （曾用 lipo 合成通用二进制，但 CI 上合成产物运行异常——双击/执行进 dartvm
  # 帮助页，未再深究，老板决定取消合成、简化为两包，2026-09-20）。
  # 注意：x64 必须用 macos-15-intel——macos-13 已于 2025-12-04 退役，请求退役标签
  # 的 job 会永远 Queued 不报错；macos-15-intel 是最后的 Intel 镜像（至 2027-08），
  # 之后 GitHub Actions 不再有 x86_64 macOS，届时需另寻方案（如自建 runner）。
  macos-cli:
    needs: [test]
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build CLI
        working-directory: cli
        run: |
          dart pub get
          mkdir -p ../_release.gitomit
          dart compile exe bin/einz_tui.dart -o ../_release.gitomit/einz-tui-macos-${{ matrix.arch }}
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: _release.gitomit/einz-tui-macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: einz-tui-macos-${{ matrix.arch }}
          path: _release.gitomit/einz-tui-macos-${{ matrix.arch }}

  # Linux 桌面 CLI（einz-tui-linux-x64）：
  # dart compile exe 只产出宿主架构，ubuntu-latest 是 x64 → 只出 x64 一份。
  # （ARM 版若将来要：换 ubuntu-24.04-arm runner 再编一份；该镜像对私有仓库的可用
  # 性/计费与 x64 不同，故本次不并入 matrix，避免 job 起不来。）
  # 注意：产物**不自带 libsodium**（package:sodium 走 FFI 运行时 dlopen）——Linux 上
  # 打包 .so 会被 glibc 版本绑住（runner 是 glibc 2.39，老发行版跑不了），所以只随包
  # 放一份运行说明，让用户按发行版装：apt install libsodium23 / dnf install libsodium。
  linux-cli:
    needs: [test]
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build CLI
        working-directory: cli
        run: |
          dart pub get
          mkdir -p ../_release.gitomit
          dart compile exe bin/einz_tui.dart -o ../_release.gitomit/einz-tui-linux-x64
      - name: Package (tar.gz + 运行说明)
        working-directory: cli
        run: |
          cat > ../_release.gitomit/README-linux-tui.txt <<'TXT'
          einz-tui（Linux x64，AOT 原生，免 Dart 运行时）

          运行前置：系统要装 libsodium（package:sodium 走 FFI，运行时动态加载）
            Debian/Ubuntu: sudo apt install libsodium23
            RHEL/Fedora:   sudo dnf install libsodium

          运行：
            chmod +x einz-tui-linux-x64
            ./einz-tui-linux-x64 --store ~/.einz/myeinz.json --server https://einz.tic.cc

          不带参数：默认 store + 出厂候选域名；也可在该二进制同目录（或当前目录）放
          一个 localConfig.json 指定服务器：{"server":"https://your.host"}
          TXT
          tar -czf ../einz-tui-linux-x64.tar.gz \
            -C ../_release.gitomit einz-tui-linux-x64 README-linux-tui.txt
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: einz-tui-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: einz-tui-linux-x64
          path: einz-tui-linux-x64.tar.gz

  # Linux 桌面 GUI（einz-app-linux-x64.tar.gz，2026-10-12 加）：
  # 平台分支已补齐（feat/linux：video_player / mobile_scanner / open_filex /
  # video_thumbnail 无 Linux 实现，chat_page/setup_page 里已按 Platform.isLinux
  # 分流——视频给「保存到本地」占位、扫码入口隐藏、文件走下载+提示路径）。
  # 产物 = build/linux/x64/release/bundle 整个目录（自带 libflutter_linux_gtk.so
  # 与 native assets 编出的 libsqlite3），tar 包里附运行说明。
  # ⚠️ glibc 兼容线 = runner 的 2.39：比它老的发行版（Ubuntu 22.04 等）跑不了
  # （TUI 同款问题，见 linux-cli 注释）；Debian 13 / Fedora 41+ 无妨。
  # 运行期系统依赖：libgtk-3（桌面自带）、libsecret-1（密钥存储）、
  # gstreamer（audioplayers_linux 的音频链路：libgstreamer + plugins-base）、
  # libsodium（E2EE 走 FFI dlopen，**必须装**）——详见包内 README。
  linux-gui:
    needs: [test]
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 装 GTK/libsecret/gstreamer 等构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Build Linux GUI
        working-directory: app
        run: |
          eval "$(node ../scripts/appVersion.js)"
          flutter build linux --release --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER"
          # Flutter 的 Linux 构建不接受把版本写进产物：--build-name 只是被公共参数
          # 收下，linux 侧无人消费（对比 Windows 写 PE FILEVERSION / macOS 写
          # Info.plist），二进制里 strings 也找不到版本串。所以旁车 version.txt
          # 只能在构建步当场落：与 appVersion.js 同一次 eval、同一时刻取号，
          # 打包步只读不重算（重算会因分钟边界比产物大几分钟）。
          echo "$APP_BUILD_NAME" > ../einz-app-linux-x64.version.txt
      - name: 打包（tar.gz + 运行说明 + 旁车 version.txt）
        # Linux 的版本号不在产物里（见 Build step 注释），读构建步落的旁车文件。
        run: |
          NAME="$(cat einz-app-linux-x64.version.txt 2>/dev/null || true)"
          [[ "$NAME" =~ ^[0-9]{4}\.[0-9]{4}\.[0-9]{2}$ ]] || {
            echo "❌ einz-app-linux-x64.version.txt 缺失或不是 yymm.ddhh.mm（实际：「$NAME」）——Build step 没落盘？" >&2
            exit 1
          }
          mkdir -p _release.gitomit/einz
          cp -r app/build/linux/x64/release/bundle/. _release.gitomit/einz/
          cat > _release.gitomit/einz/README-linux-gui.txt <<'TXT'
          einz（Linux x64 GUI）

          运行前置（缺 libsodium / gstreamer 起不来或语音没声音）：
            Debian/Ubuntu: sudo apt install libsodium23 libsecret-1-0 libgtk-3-0 \
              gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          音频输出（按声音系统装，Debian 13 默认 PipeWire）：
            PipeWire:    gstreamer1.0-pipewire
            PulseAudio:  gstreamer1.0-pulseaudio
          注：libsqlite3 已由构建内嵌（native assets），无需单独装；
              glibc 需 ≥ 2.39（构建线），Debian 13 / Fedora 41+ 满足。

          运行：
            chmod +x einz
            ./einz

          开发切换服务器（正式包不需要）：./einz --server http://localhost:3000
          TXT
          tar -czf einz-app-linux-x64.tar.gz -C _release.gitomit einz
          ls -lh einz-app-linux-x64.tar.gz einz-app-linux-x64.version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: einz-linux-x64
          path: |
            einz-app-linux-x64.tar.gz
            einz-app-linux-x64.version.txt
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: |
            einz-app-linux-x64.tar.gz
            einz-app-linux-x64.version.txt

  ios:
    needs: [test]
    # `inputs.platform == 'all'` 不能漏：其余 job 都有，iOS 曾漏掉 → 手动选 all 时
    # 它会整 job skip（2026-09-21 老板实测）
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    # CI 只出 **App Store 包**（老板 2026-09-21）：Ad Hoc 只对白名单里那几台有效、
    # 本机 `app/ios/buildIos.sh adhoc` 直装更快，CI 上没有它的位置——所以这里不设渠道
    # 参数、不留 Ad Hoc 分支与产物，永远走 exportOptionsAppStore.plist。
    # 证书是 Apple Distribution，描述文件是 "Einz Dist Appstore"（无设备列表）。
    # **构建成功即自动上传 TestFlight**（老板 2026-09-21 定）——push 与手动触发都一样，
    # 没有"只打包不上传"的开关；要产出包但不传，用本机 buildIos.sh。
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        id: secrets
        env:
          HAS_P12: ${{ secrets.IOS_P12_CERTIFICATE != '' }}
          HAS_PROFILE: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE != '' }}
          HAS_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID != '' }}
          HAS_ASC_ISSUER: ${{ secrets.ASC_API_ISSUER != '' }}
          HAS_ASC_P8: ${{ secrets.ASC_P8_KEY != '' }}
        run: |
          cfg=true
          [[ "$HAS_P12" == "true" && "$HAS_PROFILE" == "true" ]] || cfg=false
          echo "configured=$cfg" >> "$GITHUB_OUTPUT"
          echo "证书=$HAS_P12 描述文件(appstore)=$HAS_PROFILE ASC(key=$HAS_ASC_KEY_ID issuer=$HAS_ASC_ISSUER p8=$HAS_ASC_P8) → 构建=$cfg"
          # 上传已是既定动作，缺 ASC secrets 就当场失败（别等构建完才在最后一步报错，
          # 更别静默不传——"CI 绿但没传"是最难发现的那种坏）。
          # 只在确实会构建时校验：签名本身没配时该安静跳过，不是报错。
          if [[ "$cfg" == "true" && ( "$HAS_ASC_KEY_ID" != "true" || "$HAS_ASC_ISSUER" != "true" || "$HAS_ASC_P8" != "true" ) ]]; then
            echo "❌ 缺 ASC secrets（ASC_API_KEY_ID / ASC_API_ISSUER / ASC_P8_KEY）——TestFlight 上传是自动动作，见 docs/IOS.md §4.3" >&2
            exit 1
          fi
      - name: Skip iOS build (no signing secrets)
        if: steps.secrets.outputs.configured != 'true'
        run: |
          echo "未配置 iOS 签名 secrets → 跳过 iOS 构建"
          echo "  需要 IOS_P12_CERTIFICATE + IOS_P12_PASSWORD + IOS_APPSTORE_PROVISIONING_PROFILE"
      - name: Select Xcode (iOS 26 SDK)
        if: steps.secrets.outputs.configured == 'true'
        run: |
          # App Store 只收 iOS 26 SDK 起构建的包（Apple 2026-04-28 起）；挑 runner 上最新的
          # 一版 Xcode 并显式选中，免得用默认的旧 Xcode 白跑一轮再被 Apple 退回
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [[ -n "$newest" ]]; then
            sudo xcode-select -s "$newest/Contents/Developer" 2>/dev/null \
              || xcode-select -s "$newest/Contents/Developer"
            echo "选中 $newest"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          sdk=$(xcodebuild -showsdks | grep -o 'iphoneos[0-9.]*' | sort -V | tail -1)
          major=${sdk#iphoneos}; major=${major%%.*}
          if [[ -z "$major" || "$major" -lt 26 ]]; then
            echo "❌ 该 runner 的 iOS SDK 是 ${sdk:-未知}，低于 iOS 26——App Store 会退回。请改用写死 Xcode 版本的 runner（如 macos-26）" >&2
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        if: steps.secrets.outputs.configured == 'true'
        with:
          channel: stable
          cache: true
      - name: Install signing certificate
        if: steps.secrets.outputs.configured == 'true'
        env:
          IOS_P12_CERTIFICATE: ${{ secrets.IOS_P12_CERTIFICATE }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$IOS_P12_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain
      - name: Install provisioning profile (appstore)
        if: steps.secrets.outputs.configured == 'true'
        env:
          # "Einz Dist Appstore"（cc.tic.einz，无设备列表）
          # 生成方式：base64 -i 4_Einz_Dist_Appstore_cc.tic.einz.mobileprovision | pbcopy
          PROFILE_STORE: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          printf '%s' "$PROFILE_STORE" | base64 --decode > /tmp/einz-store.mobileprovision
          uuid=$(security cms -D -i /tmp/einz-store.mobileprovision | plutil -extract UUID raw -)
          name=$(security cms -D -i /tmp/einz-store.mobileprovision | plutil -extract Name raw -)
          # 文件名按描述文件自己的 UUID 落盘：Xcode 从该目录索引描述文件，UUID 命名是它
          # 自己的约定（本机 app/ios/buildIos.sh 的经验；实测任意名也能找到，这里求稳）
          cp /tmp/einz-store.mobileprovision "$PROFILE_DIR/$uuid.mobileprovision"
          echo "✅ 已安装描述文件: ${name}（${uuid}）"
          # 防呆：配成 Ad Hoc 描述文件（或别的 App）当场拦掉，别等到 export 阶段
          # 报一句含糊的 "no profile found"
          # （exportOptionsAppStore.plist 要求 profile 名为 "Einz Dist Appstore"）
          [[ "$name" == "Einz Dist Appstore" ]] || {
            echo "❌ 描述文件是「${name}」，不是「Einz Dist Appstore」——IOS_APPSTORE_PROVISIONING_PROFILE 配错文件了" >&2
            exit 1
          }
      - name: Point Xcode Release signing at the App Store profile
        if: steps.secrets.outputs.configured == 'true'
        working-directory: app
        run: |
          # archive 阶段用的是**工程里的 Release 设置**（Runner 的 Release 配置写着
          # CODE_SIGN_STYLE=Manual + PROVISIONING_PROFILE_SPECIFIER="Einz Dist Adhoc"，
          # 见 app/ios/Runner.xcodeproj/project.pbxproj），而 `--export-options-plist`
          # 只作用于之后的**导出**阶段——所以只删 Ad Hoc 描述文件 secret 会让 archive
          # 直接报 "No profile ... matching 'Einz Dist Adhoc' found"（2026-09-21 实测）。
          # CI 只出 App Store 包 → 让 archive 也指到 App Store 描述文件，Ad Hoc 那份
          # 在 CI 上就彻底不需要了。**只改 CI 工作区**，不碰仓库里的工程文件。
          python3 - <<'PY'
          import pathlib, sys
          path = pathlib.Path('ios/Runner.xcodeproj/project.pbxproj')
          src = path.read_text()
          old = 'PROVISIONING_PROFILE_SPECIFIER = "Einz Dist Adhoc"'
          new = 'PROVISIONING_PROFILE_SPECIFIER = "Einz Dist Appstore"'
          if old not in src:
              sys.exit('❌ 工程里没有 Ad Hoc 描述文件设置——签名配置结构变了，请更新这一步')
          path.write_text(src.replace(old, new))
          print('已把 Release 的签名描述文件改指 App Store 包')
          PY
          grep -n 'PROVISIONING_PROFILE_SPECIFIER' ios/Runner.xcodeproj/project.pbxproj
      - name: Build iOS IPA (App Store)
        if: steps.secrets.outputs.configured == 'true'
        working-directory: app
        env:
          # 语音通话的 TURN 配置（docs/TURN.md）：配了就带上，没配照出包。
          VOICE_TURN_URLS: ${{ secrets.VOICE_TURN_URLS }}
          VOICE_TURN_USERNAME: ${{ secrets.VOICE_TURN_USERNAME }}
          VOICE_TURN_CREDENTIAL: ${{ secrets.VOICE_TURN_CREDENTIAL }}
        run: |
          eval "$(node ../scripts/appVersion.js)"
          # 构建号用**到分钟**的 UTC 时间戳（10 位），而不是共享脚本的 APP_BUILD_NUMBER
          # （yymmddhh，只到小时）：后者受 Android versionCode ≤ 2100000000 的上限约束不能
          # 加分钟，而 iOS 没有这个限制。自动上传后"同一小时内推两次"＝同一个构建号＝
          # Apple 拒收第二个包，所以这里加细。CFBundleVersion 只要单调递增即可，数字位数
          # 不敏感；本地 buildIos.sh 的 8 位戳比它小，不会冲突。
          IOS_BUILD_NUMBER="$(date -u +%y%m%d%H%M)"
          echo "==> App Store 包 $APP_BUILD_NAME($IOS_BUILD_NUMBER)"
          # 语音通话的 TURN（跨网打洞必需，见 docs/TURN.md）：配了 secrets 就带上，
          # 没配也照出包——只是那个包跨网打不通（不因为缺配置让 CI 变红）。
          TURN_DEFINES=()
          if [[ -n "${VOICE_TURN_URLS}" ]]; then
            TURN_DEFINES+=(--dart-define="VOICE_TURN_URLS=${VOICE_TURN_URLS}")
          fi
          if [[ -n "${VOICE_TURN_USERNAME}" ]]; then
            TURN_DEFINES+=(--dart-define="VOICE_TURN_USERNAME=${VOICE_TURN_USERNAME}")
          fi
          if [[ -n "${VOICE_TURN_CREDENTIAL}" ]]; then
            TURN_DEFINES+=(--dart-define="VOICE_TURN_CREDENTIAL=${VOICE_TURN_CREDENTIAL}")
          fi
          flutter build ipa --release \
            --build-name "$APP_BUILD_NAME" --build-number "$IOS_BUILD_NUMBER" \
            --export-options-plist=ios/exportOptionsAppStore.plist \
            "${TURN_DEFINES[@]}"
          mkdir -p /tmp/einz-out
          # 固定文件名：Release 资产列表里一眼能认出来（与 einz-app-android.apk 同风格）
          cp build/ios/ipa/*.ipa /tmp/einz-out/einz-app-ios-appstore.ipa
          # 旁车 version.txt（与 macos/android 同款规矩）：从 .ipa 自己的
          # Payload/Runner.app/Info.plist 读版本号，不重跑 appVersion.js
          rm -rf /tmp/einz-ipa-check && mkdir -p /tmp/einz-ipa-check
          unzip -q /tmp/einz-out/einz-app-ios-appstore.ipa -d /tmp/einz-ipa-check
          NAME="$(/usr/bin/plutil -extract CFBundleShortVersionString raw /tmp/einz-ipa-check/Payload/Runner.app/Info.plist)"
          [[ "$NAME" =~ ^[0-9]{4}\.[0-9]{4}\.[0-9]{2}$ ]] || {
            echo "❌ IPA 版本号是「$NAME」，不是 yymm.ddhh.mm——flutter 没吃到 --build-name？" >&2
            exit 1
          }
          echo "$NAME" > /tmp/einz-out/einz-app-ios-appstore.version.txt
          rm -rf /tmp/einz-ipa-check
          ls -lh /tmp/einz-out
      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.configured == 'true' # 没构建就没产物，别去 warn 空目录
        with:
          name: einz-ios-appstore
          path: |
            /tmp/einz-out/einz-app-ios-appstore.ipa
            /tmp/einz-out/einz-app-ios-appstore.version.txt
      # App Store 包进 Releases 的 latest 页（与 android/macos 同款）
      - name: Upload to Release
        if: steps.secrets.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: |
            /tmp/einz-out/einz-app-ios-appstore.ipa
            /tmp/einz-out/einz-app-ios-appstore.version.txt
      # TestFlight：构建成功即自动上传（老板 2026-09-21 定），push 与手动触发一视同仁
      - name: Upload to TestFlight
        if: steps.secrets.outputs.configured == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER: ${{ secrets.ASC_API_ISSUER }}
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
        run: |
          # altool 从 ~/private_keys/AuthKey_<KeyID>.p8 读私钥（本机 buildIos.sh 同款路径）
          mkdir -p ~/private_keys
          printf '%s' "$ASC_P8_KEY" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          xcrun altool --upload-app -f /tmp/einz-out/einz-app-ios-appstore.ipa -t ios \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER"
          echo "✅ 已上传 TestFlight（处理需要几分钟才出现在 App Store Connect）"
