# Einz 多平台构建（GitHub Actions）
#
# 覆盖 Android / iOS / macOS / Windows 四个目标，另在 Windows / macOS 上顺带出
# TUI（einz-tui-windows / einz-tui-macos-*），Linux 只出 TUI（einz-tui-linux-x64，
# 见 linux-cli job；Linux GUI 未发布：video_player / mobile_scanner / open_filex /
# video_thumbnail 无 Linux 实现，需要先做平台分支）。触发方式（老板 2026-09-21 定）：
#   - push main：自动跑全平台（纯文档改动被 paths-ignore 挡掉，不烧额度）
#   - workflow_dispatch：手动选择单个平台
#   - push tag v*：全平台（路径过滤对 tag 不生效，发版一律全跑）
#
# 说明：
#   - Android / Windows 无签名要求，直接出包
#   - macOS 分两个渠道：配了 Developer ID secrets = -dist（Developer ID 签名 +
#     公证 + staple，**沙盒**，异机双击即用）；未配 = -dev（ad-hoc，仅本机调试）
#     需要的 secrets：MACOS_DEVID_P12(Base64) + MACOS_DEVID_P12_PASSWORD +
#     MACOS_NOTARY_APPLE_ID + MACOS_NOTARY_PASSWORD + MACOS_NOTARY_TEAM_ID
#   - iOS 需要 secrets：IOS_P12_CERTIFICATE(Base64) + IOS_P12_PASSWORD +
#       adhoc 渠道   → IOS_PROVISIONING_PROFILE（"Einz Dist Adhoc"，含 UDID 白名单）
#       appstore 渠道 → IOS_APPSTORE_PROVISIONING_PROFILE（"Einz Dist Appstore"，无设备列表）
#     证书两者同一张（Apple Distribution），只有描述文件不同；渠道由手动触发的
#     ios_channel 输入选择（push 触发回落 adhoc）。缺 secrets 时 job 照常被调度但
#     **干净跳过构建**（只打印一行提示，不红）
#   - macOS 计费 10x、Windows 2x，注意私有仓库额度
name: Multi Platform Build

on:
  # 手动：Actions 页面 Run workflow，可选单个平台（inputs 必须保留——job 的 if 依赖
  # `inputs.platform`；只解开 workflow_dispatch 而删掉 inputs，手动触发会零 job）
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all = android+windows+macos+linux)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - macos
          - windows
          - linux
      ios_channel:
        description: 'iOS 包渠道：adhoc / appstore / both（both = 同一次构建出两份）'
        required: false
        default: 'both'
        type: choice
        options:
          - both     # 一次 archive 导出两份（默认）
          - adhoc    # Ad Hoc：含 UDID 白名单，可 devicectl 直装
          - appstore # App Store / TestFlight：无设备列表，不能直装
      ios_upload:
        description: 'iOS：打完把 App Store 包传到 TestFlight（需 ASC_* 三个 secrets）'
        required: false
        default: false
        type: boolean
  push:
    # 推 main 就自动跑（老板 2026-09-21）：改代码即验证。
    # 注意 `tags` 与 `branches` 是两个独立过滤：只写 tags 时**推分支不会触发**
    # （此前就是这么写的，所以 push main 一直不跑，见 124ab0f）。
    branches:
      - main
    # 纯文档/记忆改动不烧额度（私有仓库 macOS 计费 10x、Windows 2x）。
    # 注：路径过滤对 tag 推送不生效，即发版 tag 一律触发全平台。
    paths-ignore:
      - 'docs/**'
      - 'aimemo/**'
      - '**.md'
    tags:
      - 'v*'

jobs:
  android:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Patch pub cache (AGP 9 compat)
        working-directory: app
        run: bash ../scripts/patchPubCache.sh
      - name: Build APK
        working-directory: app
        env:
          # 公共 runner 仅 7GB 内存：覆盖 gradle.properties 里的 -Xmx8G（按本机大内存设置），
          # 避免 OOM killer 杀 Gradle（曾表现为跑约 16 分钟后 exit 143）
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G"
        run: |
          # 版本号 yymm.ddhh.mm / 构建号 yymmddhh，各平台统一（唯一出处 scripts/appVersion.js）
          eval "$(node ../scripts/appVersion.js)"
          flutter build apk --release --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER"
      - name: Rename APK
        working-directory: app
        run: mv build/app/outputs/flutter-apk/app-release.apk einz-app-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: einz-android
          path: app/einz-app-android.apk
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: app/einz-app-android.apk

  windows:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Build Windows
        working-directory: app
        # 用 bash 而不是默认的 PowerShell，好跟其余 job 共用 scripts/appVersion.js。
        # 只传版本号不传构建号：FILEVERSION 四个字段各 16 位（≤65535），
        # 构建号 26091810 塞不进去，不传则 flutter 取 0。
        shell: bash
        run: |
          eval "$(node ../scripts/appVersion.js)"
          flutter build windows --release --build-name "$APP_BUILD_NAME"
      - name: Fetch libsodium.dll
        # GUI（package:sodium FFI）和 CLI 运行时都要 libsodium.dll，Flutter/Dart 打包不会自动带上，
        # 官方也没集成进产物——从 libsodium 官方 release 下载 MSVC 预编译包。
        # 解压到仓库根（libSodium-msvc/），后续 GUI zip 和 CLI zip 两个打包步骤各自取用
        shell: pwsh
        run: |
          curl.exe -L -o libsodium-msvc.zip https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-msvc.zip
          Expand-Archive libsodium-msvc.zip -DestinationPath libsodium-msvc
          # 实际包内路径：libsodium/x64/Release/v142/dynamic/libsodium.dll（顶层还有 libsodium/ 目录 + dynamic 子目录）
          Copy-Item libsodium-msvc/libsodium/x64/Release/v142/dynamic/libsodium.dll app/build/windows/x64/runner/Release/
      - name: Zip release folder
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath einz-gui-windows.zip
      - name: Build CLI
        working-directory: cli
        # Windows 默认 shell 是 PowerShell：mkdir 是 New-Item 的别名，-p 会被解析成
        # -Path，目录已存在即报错；用 New-Item -Force 等价 bash 的 mkdir -p
        run: |
          dart pub get
          # exe + libsodium.dll 合并打进 einz-tui-windows.zip（exe 运行时按同目录找 dll），
          # 用户下载解压即可运行，无需再单独下 dll
          New-Item -ItemType Directory -Force ../_release.gitomit/einz-tui-windows
          dart compile exe bin/einz_tui.dart -o ../_release.gitomit/einz-tui-windows/einz-tui-windows.exe
          Copy-Item ../libsodium-msvc/libsodium/x64/Release/v142/dynamic/libsodium.dll ../_release.gitomit/einz-tui-windows/
          Compress-Archive -Path ../_release.gitomit/einz-tui-windows/* -DestinationPath ../einz-tui-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: einz-windows
          path: |
            einz-gui-windows.zip
            einz-tui-windows.zip
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          # 每次构建覆盖 latest release，访客始终在同一地址取最新包
          make_latest: true
          files: |
            einz-gui-windows.zip
            einz-tui-windows.zip

  macos:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check Developer ID secrets
        id: devid
        env:
          HAS_P12: ${{ secrets.MACOS_DEVID_P12 != '' }}
        run: echo "configured=${{ env.HAS_P12 }}" >> "$GITHUB_OUTPUT"
      - name: Import Developer ID certificate
        if: steps.devid.outputs.configured == 'true'
        env:
          MACOS_DEVID_P12: ${{ secrets.MACOS_DEVID_P12 }}
          MACOS_DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
        run: |
          echo "$MACOS_DEVID_P12" | base64 --decode > devid.p12
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          security import devid.p12 -k build.keychain -P "$MACOS_DEVID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain
      - name: Disable Swift Package Manager
        # 与 codemagic ios-release 相同：Podfile 存在时走 CocoaPods，避免 Flutter 3.47 默认 SPM 冲突
        run: flutter config --no-enable-swift-package-manager
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Build macOS App
        working-directory: app
        run: |
          # CI 无开发证书/profile：临时禁用签名再构建（工程文件为 Automatic+Team，
          # flutter build 传参会覆盖环境变量，故直接改 pbxproj；不改仓库内文件）
          # 配了 Developer ID secrets 时也先这样出未签名产物，签名统一在下一步做
          # （无 profile 时 Xcode 签名会嵌/要求 provisioning，直接禁干净）
          sed -i '' -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
                    -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/' \
                    -e 's/DEVELOPMENT_TEAM = CQ6733CTMV;//' \
                    macos/Runner.xcodeproj/project.pbxproj
          eval "$(node ../scripts/appVersion.js)"
          flutter build macos --release --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER"
      - name: Sign (Developer ID + notarize + staple)
        if: steps.devid.outputs.configured == 'true'
        working-directory: app
        env:
          MACOS_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.MACOS_NOTARY_KEYCHAIN_PROFILE }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          APP=build/macos/Build/Products/Release/einz.app
          # flutter 可能嵌入本机 profile（CI 上通常没有，防御性删除）。Developer ID
          # 分发不需要也不该带 profile——去 profile 后 entitlements 里也不能有任何
          # 需 profile 背书的项（见下面 ENT 与 macos/Runner/Release.entitlements）
          rm -f "$APP/Contents/embedded.provisionprofile"
          # 直接用仓库里的 Release.entitlements（沙盒 + 出站网络 + 用户选择文件三个
          # 布尔项），**不要**再像以前那样用 python 剥掉 app-sandbox：
          # 当初「沙盒 + Keychain + Developer ID 三角死锁」的真凶是 flutter_secure_storage
          # 默认走数据保护 Keychain（要 keychain-access-groups，而该 entitlement 只能由
          # provisioning profile 授权 → 无 profile 时每次 SecItem* 都是 -34018）；桌面端
          # 已改成文件型 Keychain（secure_store.dart 的 usesDataProtectionKeychain: false），
          # 沙盒与 Developer ID 从此完全兼容，不需要去沙盒。详见 aimemo/worklog.md 2026-09-20。
          ENT=macos/Runner/Release.entitlements
          IDENTITY="Developer ID Application"
          find "$APP/Contents/Frameworks" -name "*.framework" \
            -exec codesign -f -s "$IDENTITY" --timestamp --options runtime {} \;
          codesign -f -s "$IDENTITY" --timestamp --options runtime --entitlements "$ENT" "$APP"
          codesign --verify -v --strict "$APP"
          # 公证凭据存入临时 keychain profile（secrets 不落日志）
          xcrun notarytool store-credentials notary-ci \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD"
          # zip 必须用 ditto（保留 Frameworks 符号链接，zip 命令会破坏结构导致公证失败）
          ditto -c -k --keepParent --sequesterRsrc "$APP" notary-upload.zip
          xcrun notarytool submit notary-upload.zip --keychain-profile notary-ci --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vv -t exec "$APP"
          rm -f notary-upload.zip
      - name: Re-sign ad-hoc without restricted entitlements
        if: steps.devid.outputs.configured != 'true'
        working-directory: app
        run: |
          # 未配 Developer ID secrets 的兜底：只打 ad-hoc 签名（沙盒照常保留）。
          # 之所以能直接带 Release.entitlements：它已只含三个布尔项（沙盒/出站网络/
          # 用户选择文件），没有 keychain-access-groups、get-task-allow 这类需真实
          # 身份背书的受限 entitlement——带那些才会被内核 AMFI 判 Invalid Signature、
          # launchd 启动即 SIGKILL（表现为"应用程序无法打开"）。
          # **不要加 `--options runtime`**：ad-hoc 签名没有 Team ID，Hardened Runtime
          # 会打开 Library Validation，dyld 加载内嵌 framework 时报
          # "mapping process and mapped file have different Team IDs" 直接起不来
          # （2026-09-20 本机实测对比过）。Developer ID 那条能开 runtime 是因为所有
          # 组件同属一个 Team ID，ad-hoc 没有这个前提。
          ENT=macos/Runner/Release.entitlements
          find build/macos/Build/Products/Release/einz.app/Contents/Frameworks -name "*.framework" \
            -exec codesign -f -s - --timestamp=none {} \;
          codesign -f -s - --timestamp=none --entitlements "$ENT" \
            build/macos/Build/Products/Release/einz.app
          codesign --verify -v build/macos/Build/Products/Release/einz.app
      - name: Zip app bundle
        # 命名与本地打包对齐（buildMacos.sh）：配 secrets = -dist（Developer ID 可分发），
        # 未配 = -dev（ad-hoc 兜底）；CI 无时间串，版本号（APP_BUILD_NAME）已够区分构建
        run: >
          SUFFIX=${{ steps.devid.outputs.configured == 'true' && 'dist' || 'dev' }};
          cd app/build/macos/Build/Products/Release &&
          zip -r -y "$GITHUB_WORKSPACE/einz-gui-macos-$SUFFIX.zip" einz.app
      - uses: actions/upload-artifact@v4
        with:
          name: einz-macos
          path: |
            einz-gui-macos-*.zip
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: |
            einz-gui-macos-*.zip

  # macOS 桌面 CLI（einz-tui-macos）分架构两个产物：
  # dart compile exe 只产出宿主架构，且 Dart 不支持 macOS 跨架构编译，
  # 所以分别在 Intel 与 Apple Silicon runner 上各编一份，直接分架构提供下载
  # （曾用 lipo 合成通用二进制，但 CI 上合成产物运行异常——双击/执行进 dartvm
  # 帮助页，未再深究，老板决定取消合成、简化为两包，2026-09-20）。
  # 注意：x64 必须用 macos-15-intel——macos-13 已于 2025-12-04 退役，请求退役标签
  # 的 job 会永远 Queued 不报错；macos-15-intel 是最后的 Intel 镜像（至 2027-08），
  # 之后 GitHub Actions 不再有 x86_64 macOS，届时需另寻方案（如自建 runner）。
  macos-cli:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build CLI
        working-directory: cli
        run: |
          dart pub get
          mkdir -p ../_release.gitomit
          dart compile exe bin/einz_tui.dart -o ../_release.gitomit/einz-tui-macos-${{ matrix.arch }}
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: _release.gitomit/einz-tui-macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: einz-tui-macos-${{ matrix.arch }}
          path: _release.gitomit/einz-tui-macos-${{ matrix.arch }}

  # Linux 桌面 CLI（einz-tui-linux-x64）：
  # dart compile exe 只产出宿主架构，ubuntu-latest 是 x64 → 只出 x64 一份。
  # （ARM 版若将来要：换 ubuntu-24.04-arm runner 再编一份；该镜像对私有仓库的可用
  # 性/计费与 x64 不同，故本次不并入 matrix，避免 job 起不来。）
  # 注意：产物**不自带 libsodium**（package:sodium 走 FFI 运行时 dlopen）——Linux 上
  # 打包 .so 会被 glibc 版本绑住（runner 是 glibc 2.39，老发行版跑不了），所以只随包
  # 放一份运行说明，让用户按发行版装：apt install libsodium23 / dnf install libsodium。
  linux-cli:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build CLI
        working-directory: cli
        run: |
          dart pub get
          mkdir -p ../_release.gitomit
          dart compile exe bin/einz_tui.dart -o ../_release.gitomit/einz-tui-linux-x64
      - name: Package (tar.gz + 运行说明)
        working-directory: cli
        run: |
          cat > ../_release.gitomit/README-linux-tui.txt <<'TXT'
          einz-tui（Linux x64，AOT 原生，免 Dart 运行时）

          运行前置：系统要装 libsodium（package:sodium 走 FFI，运行时动态加载）
            Debian/Ubuntu: sudo apt install libsodium23
            RHEL/Fedora:   sudo dnf install libsodium

          运行：
            chmod +x einz-tui-linux-x64
            ./einz-tui-linux-x64 --store ~/.einz/myeinz.json --server https://einz.tic.cc

          不带参数：默认 store + 出厂候选域名；也可在该二进制同目录（或当前目录）放
          一个 localConfig.json 指定服务器：{"server":"https://your.host"}
          TXT
          tar -czf ../einz-tui-linux-x64.tar.gz \
            -C ../_release.gitomit einz-tui-linux-x64 README-linux-tui.txt
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: einz-tui-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: einz-tui-linux-x64
          path: einz-tui-linux-x64.tar.gz

  ios:
    # `inputs.platform == 'all'` 不能漏：其余 job 都有，iOS 曾漏掉 → 手动选 all 时
    # 它会整 job skip（2026-09-21 老板实测）
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    # 渠道由 ios_channel 决定（手动触发才有该输入；push 触发回落 adhoc，保持现状）：
    #   adhoc    → 只出 Ad Hoc（含 UDID 白名单，可 devicectl 直装）
    #   appstore → 只出 App Store / TestFlight 包（无设备列表，不能直装）
    #   both     → 一次 archive 导出两份（手动触发的默认值）
    # 两渠道 bundle id 相同、证书同为 Apple Distribution，差别只在 method 与描述文件
    # （见 app/ios/exportOptions*.plist）。
    env:
      IOS_CHANNEL: ${{ inputs.ios_channel || 'adhoc' }}
      # 传 TestFlight 是显式开关：只有手动触发且勾了才做（push 触发的构建绝不上传）
      IOS_UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.ios_upload) || false }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        id: secrets
        env:
          HAS_P12: ${{ secrets.IOS_P12_CERTIFICATE != '' }}
          HAS_PROFILE_ADHOC: ${{ secrets.IOS_PROVISIONING_PROFILE != '' }}
          HAS_PROFILE_STORE: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE != '' }}
          HAS_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID != '' }}
          HAS_ASC_ISSUER: ${{ secrets.ASC_API_ISSUER != '' }}
          HAS_ASC_P8: ${{ secrets.ASC_P8_KEY != '' }}
        run: |
          # 组合判定一律在 shell 里做：GitHub 表达式的 && / || 把 "false" 也当 truthy，
          # 链式比较（A != '' && B != ''）实际只会返回 B 的比较结果
          WANT=""
          [[ "$IOS_CHANNEL" == "adhoc"    || "$IOS_CHANNEL" == "both" ]] && WANT="$WANT adhoc"
          [[ "$IOS_CHANNEL" == "appstore" || "$IOS_CHANNEL" == "both" ]] && WANT="$WANT appstore"
          cfg=true
          [[ "$HAS_P12" == "true" ]] || cfg=false
          for ch in $WANT; do
            if [[ "$ch" == "adhoc"    && "$HAS_PROFILE_ADHOC" != "true" ]]; then cfg=false; fi
            if [[ "$ch" == "appstore" && "$HAS_PROFILE_STORE" != "true" ]]; then cfg=false; fi
          done
          echo "channel=$IOS_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "configured=$cfg" >> "$GITHUB_OUTPUT"
          echo "渠道=$IOS_CHANNEL（需描述文件:$WANT）上传=$IOS_UPLOAD 证书=$HAS_P12 描述文件(adhoc=$HAS_PROFILE_ADHOC appstore=$HAS_PROFILE_STORE) ASC(key=$HAS_ASC_KEY_ID issuer=$HAS_ASC_ISSUER p8=$HAS_ASC_P8) → 构建=$cfg"
      - name: Skip iOS build (no signing secrets)
        if: steps.secrets.outputs.configured != 'true'
        run: |
          echo "未配置 iOS 签名 secrets → 跳过 iOS 构建（渠道=$IOS_CHANNEL）"
          echo "  需要 IOS_P12_CERTIFICATE + IOS_P12_PASSWORD + 该渠道的描述文件 secret："
          echo "    adhoc    → IOS_PROVISIONING_PROFILE"
          echo "    appstore → IOS_APPSTORE_PROVISIONING_PROFILE"
      - name: Select Xcode (iOS 26 SDK)
        if: steps.secrets.outputs.configured == 'true'
        run: |
          # App Store 只收 iOS 26 SDK 起构建的包（Apple 2026-04-28 起）；挑 runner 上最新的
          # 一版 Xcode 并显式选中，免得用默认的旧 Xcode 白跑一轮再被 Apple 退回
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [[ -n "$newest" ]]; then
            sudo xcode-select -s "$newest/Contents/Developer" 2>/dev/null \
              || xcode-select -s "$newest/Contents/Developer"
            echo "选中 $newest"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          if [[ "$IOS_CHANNEL" != "adhoc" ]]; then
            sdk=$(xcodebuild -showsdks | grep -o 'iphoneos[0-9.]*' | sort -V | tail -1)
            major=${sdk#iphoneos}; major=${major%%.*}
            if [[ -z "$major" || "$major" -lt 26 ]]; then
              echo "❌ 该 runner 的 iOS SDK 是 ${sdk:-未知}，低于 iOS 26——App Store 会退回。请改用写死 Xcode 版本的 runner（如 macos-26）" >&2
              exit 1
            fi
          fi
      - uses: subosito/flutter-action@v2
        if: steps.secrets.outputs.configured == 'true'
        with:
          channel: stable
          cache: true
      - name: Install signing certificate
        if: steps.secrets.outputs.configured == 'true'
        env:
          IOS_P12_CERTIFICATE: ${{ secrets.IOS_P12_CERTIFICATE }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$IOS_P12_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain
      - name: Install provisioning profile(s)
        if: steps.secrets.outputs.configured == 'true'
        env:
          # 两份描述文件内容不同，绝不能混用：
          #   adhoc    → Einz Dist Adhoc（cc.tic.einz，含 UDID 白名单）
          #   appstore → Einz Dist Appstore（cc.tic.einz，无设备列表）
          # 生成方式：base64 -i 4_Einz_Dist_Adhoc_cc.tic.einz.mobileprovision | pbcopy
          PROFILE_ADHOC: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          PROFILE_STORE: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          install_profile () { # $1=base64 内容  $2=期望渠道（防呆）
            local raw="$1" want="$2" uuid name
            printf '%s' "$raw" | base64 --decode > "/tmp/einz-$want.mobileprovision"
            uuid=$(security cms -D -i "/tmp/einz-$want.mobileprovision" | plutil -extract UUID raw -)
            name=$(security cms -D -i "/tmp/einz-$want.mobileprovision" | plutil -extract Name raw -)
            # 文件名按描述文件自己的 UUID 落盘：Xcode 从该目录索引描述文件，UUID 命名是它
            # 自己的约定（本机 app/ios/buildIos.sh 的经验；实测任意名也能找到，这里求稳）
            cp "/tmp/einz-$want.mobileprovision" "$PROFILE_DIR/$uuid.mobileprovision"
            echo "✅ 已安装描述文件: $name（$uuid）用于 $want"
            # 防呆：装错渠道（如 appstore 任务配了 adhoc profile）就在这里拦掉，
            # 别等到 export 阶段报一句含糊的 "no profile found"
            case "$want" in
              adhoc)
                [[ "$name" == *Adhoc* || "$name" == *Ad\ Hoc* ]] || { echo "❌ 渠道=adhoc 但描述文件是「$name」——IOS_PROVISIONING_PROFILE 配错文件了" >&2; exit 1; } ;;
              appstore)
                [[ "$name" == *Appstore* || "$name" == *App\ Store* ]] || { echo "❌ 渠道=appstore 但描述文件是「$name」——IOS_APPSTORE_PROVISIONING_PROFILE 配错文件了" >&2; exit 1; } ;;
            esac
          }
          case "$IOS_CHANNEL" in
            adhoc)    install_profile "$PROFILE_ADHOC" adhoc ;;
            appstore) install_profile "$PROFILE_STORE" appstore ;;
            both)     install_profile "$PROFILE_ADHOC" adhoc; install_profile "$PROFILE_STORE" appstore ;;
          esac
      - name: Build iOS IPA (signed)
        if: steps.secrets.outputs.configured == 'true'
        working-directory: app
        run: |
          eval "$(node ../scripts/appVersion.js)"
          OUT=/tmp/einz-out
          mkdir -p "$OUT"
          echo "==> 渠道=$IOS_CHANNEL 版本=$APP_BUILD_NAME($APP_BUILD_NUMBER)"
          if [[ "$IOS_CHANNEL" == "appstore" ]]; then
            flutter build ipa --release \
              --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER" \
              --export-options-plist=ios/exportOptionsAppStore.plist
            cp build/ios/ipa/*.ipa "$OUT/einz-app-ios-appstore.ipa"
          else
            flutter build ipa --release \
              --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER" \
              --export-options-plist=ios/exportOptionsAdhoc.plist
            cp build/ios/ipa/*.ipa "$OUT/einz-app-ios-adhoc.ipa"
            if [[ "$IOS_CHANNEL" == "both" ]]; then
              # 同一个 archive 再导出一次 App Store 包，**不重新编译**
              # （app/ios/exportOptions*.plist 注释里写的就是这条路径）
              rm -rf /tmp/einz-store-out && mkdir -p /tmp/einz-store-out
              xcodebuild -exportArchive \
                -archivePath build/ios/archive/Runner.xcarchive \
                -exportOptionsPlist ios/exportOptionsAppStore.plist \
                -exportPath /tmp/einz-store-out
              cp /tmp/einz-store-out/*.ipa "$OUT/einz-app-ios-appstore.ipa"
            fi
          fi
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.configured == 'true' # 没构建就没产物，别去 warn 空目录
        with:
          name: einz-ios-${{ steps.secrets.outputs.channel }}
          path: /tmp/einz-out/*.ipa
      # App Store 包进 Releases 的 latest 页（与 android/macos 同款；adhoc 包不进——它
      # 只对白名单设备有效，摆在下载页没有意义）
      - name: Upload to Release (appstore ipa)
        if: steps.secrets.outputs.configured == 'true' && env.IOS_CHANNEL != 'adhoc'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: /tmp/einz-out/einz-app-ios-appstore.ipa
      # TestFlight：显式勾了 ios_upload 才做（push 触发的构建一律不上传）
      - name: Upload to TestFlight
        if: steps.secrets.outputs.configured == 'true' && env.IOS_UPLOAD == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER: ${{ secrets.ASC_API_ISSUER }}
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
        run: |
          if [[ "$IOS_CHANNEL" == "adhoc" ]]; then
            echo "❌ ios_upload=true 但 ios_channel=adhoc：Ad Hoc 包不能传 TestFlight（改 appstore 或 both）" >&2
            exit 1
          fi
          if [[ -z "$ASC_API_KEY_ID" || -z "$ASC_API_ISSUER" || -z "$ASC_P8_KEY" ]]; then
            echo "❌ 缺 ASC secrets（ASC_API_KEY_ID / ASC_API_ISSUER / ASC_P8_KEY，见 docs/IOS.md §4）" >&2
            exit 1
          fi
          # altool 从 ~/private_keys/AuthKey_<KeyID>.p8 读私钥（本机 buildIos.sh 同款路径）
          mkdir -p ~/private_keys
          printf '%s' "$ASC_P8_KEY" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          xcrun altool --upload-app -f /tmp/einz-out/einz-app-ios-appstore.ipa -t ios \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER"
          echo "✅ 已上传 TestFlight（处理需要几分钟才出现在 App Store Connect）"
