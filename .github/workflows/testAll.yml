# Einz 测试（GitHub Actions）
#
# 与 buildMultiPlatform.yml 的分工（**方案 B**，2026-10-04 老板定）：
#   - 这个工作流：**特性分支的 push** 与 **PR** —— 改一行业务代码立刻知道测试红没红
#     （全 Linux runner，1x；出包那个 macOS 计费 10x）。
#   - 出包工作流：自己的 `test` job 先跑、所有出包 job `needs: [test]`，**测试不过不出包**；
#     main 推送与 **tag 发版**都走那条路（tag 是唯一能在发版前拦住的时机）。
#   → 所以这里的 push **排除 main**（`branches-ignore: [main]`），否则同一提交在 main
#     上会跑两遍测试。
#
# 触发：
#   - push 非 main 分支（纯文档改动被 paths-ignore 挡掉）
#   - pull_request
#   - workflow_dispatch
#
# 四个 job 直接复用 `scripts/testAll.sh <target>`——**本地怎么跑、CI 就怎么跑**，
# 不维护第二套命令（这条是刻意的：之前"我说的测试全过"其实只覆盖 analyze + server，
# app 那 250 条 widget 测试没人跑、静默红了一片）。
#
# ⚠️ 只在 **GitHub**（github remote）上生效。push 到 origin（git.tic.cc）不会触发。
name: Test All

on:
  push:
    # main 交给 buildMultiPlatform.yml 里那个 gate 用的 test job（方案 B）——
    # 这里排除掉，免得同一提交在 main 上跑两遍测试
    branches-ignore:
      - main
    paths-ignore:
      - 'docs/**'
      - 'aimemo/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'aimemo/**'
      - '**.md'
  workflow_dispatch:

# 同一分支连续推送时取消前一次没跑完的：省额度，也只关心最新那次。
# 组名用 `head_ref || ref_name`：**PR 触发与分支 push 触发归一成同一个组**
# （前者是 `feature/x`、后者是 `refs/heads/feature/x`，不归一的话同一次提交会跑两遍）。
concurrency:
  group: testAll-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: app（analyze + 全量 widget 测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # shared/lib/src/sodium.dart 走 DynamicLibrary.open 加载系统 libsodium（Linux
      # 候选路径里有 /usr/lib/x86_64-linux-gnu/libsodium.so）；libsodium-dev 提供该 .so
      - name: 装 libsodium（测试要动态加载）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsodium-dev
      - name: 跑测试
        run: scripts/testAll.sh app

  shared:
    name: shared（analyze + dart test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # shared/test 的 key_escrow / passphrase 用例会走 argon2id，而 shared/lib/src/
      # sodium.dart 用 DynamicLibrary.open 找**系统** libsodium——与 app job 同一原因
      - name: 装 libsodium（测试要动态加载）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsodium-dev
      - name: 跑测试
        run: scripts/testAll.sh shared

  cli:
    name: cli（analyze + dart test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: 跑测试
        run: scripts/testAll.sh cli

  server:
    name: server（build + 全部测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 跑测试
        run: scripts/testAll.sh server
