<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE1EF"/>
      <stop offset="100%" stop-color="#CDE9FF"/>
    </linearGradient>
  </defs>
  <!-- 明亮渐变背景（浅粉 → 浅天蓝） -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 天蓝环（后） -->
  <ellipse cx="196" cy="256" rx="108" ry="172" fill="none" stroke="#4FC3F7" stroke-width="46"/>
  <!-- 粉环（前）——与天蓝环互相嵌套、重叠较多（∞ 状交叉） -->
  <ellipse cx="316" cy="256" rx="108" ry="172" fill="none" stroke="#F48FB1" stroke-width="46"/>
</svg>
