# OnlySpace 单机部署（productLens §13.2）：Caddy（TLS/反代）+ Node 服务
# 使用前：
#   1. 按 docs/SETUP.md 生成 config.json（白名单），放到 ./config/config.json
#   2. 修改 Caddyfile 中的域名
#   3. docker compose up -d
services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - EINZ_CONFIG=/config/config.json
      - EINZ_DB=/data/app.db
      - EINZ_FILES=/data/files
      # 备份密钥（server 备份/恢复归档 AES-256-GCM 用，docs/DEPLOYMENT.md §5）：
      # 由 compose 自动读取本目录 .env 文件提供（deployment/.env 已在 .gitignore，
      # 不入库、git pull 不覆盖）。未配置时 npm run backup 会拒绝执行（防明文备份）。
      - EINZ_DB_BACKUP_KEY=${EINZ_DB_BACKUP_KEY}
    volumes:
      - ./config:/config:ro
      - ./data:/data
    expose:
      - "3000"
    networks:
      - einz

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - einz
    depends_on:
      - server

volumes:
  caddy_data:
  caddy_config:

networks:
  einz:
