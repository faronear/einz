# Einz 服务端单机部署（productLens §13.2）：Caddy（TLS/反代）+ Node 服务
# 本文件为模板：真正部署时按需拷贝为 docker-compose.yml 使用
#   （cp docker-compose.withcaddy.yml docker-compose.yml）；
#   另有无内置 Caddy 的 docker-compose.nocaddy.yml（由系统级 Caddy 反代）可选。
# 使用前：
#   1. 修改 Caddyfile 中的域名
#   2. docker compose up -d
#
# 注：**配置文件是可选的**——设备与空间都在库里（v1 的静态白名单 config.json 已废），
#     `./config` 里现在只放 `einz_server_config.json`（当前字段：maxSpaces，改后重启
#     生效）；目录为空或文件缺失都照常启动（走默认值）。
services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      # 服务端配置文件（可选）：宿主机 ./config/einz_server_config.json → 容器 /config/。
      # 文件缺失时服务端按默认值启动（当前唯一字段 maxSpaces：0=不限 / n=上限）。
      - EINZ_CONFIG=/config/einz_server_config.json
      - EINZ_DB=/data/einz.sqlite.db
      - EINZ_FILES=/data/files
      # 备份密钥（server 备份/恢复归档 AES-256-GCM 用，docs/DEPLOYMENT.md §5）：
      # 由 compose 自动读取本目录 .env 文件提供（deployment/.env 已在 .gitignore，
      # 不入库、git pull 不覆盖）。未配置时 npm run backup 会拒绝执行（防明文备份）。
      - EINZ_DB_BACKUP_KEY=${EINZ_DB_BACKUP_KEY}
    volumes:
      - ./config:/config:ro
      - ./data:/data
    expose:
      - "3000"
    networks:
      - einz

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - einz
    depends_on:
      - server

volumes:
  caddy_data:
  caddy_config:

networks:
  einz:
