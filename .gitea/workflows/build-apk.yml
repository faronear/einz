# Einz Android APK 构建工作流（Gitea Actions）
#
# 触发方式：
#   - push 到 main 分支
#   - 推送 v* 标签（如 v1.0.1）
#   - 在 Gitea 仓库页 Actions → Run workflow 手动触发
#
# 产物：app/build/app/outputs/flutter-apk/app-debug.apk（debug 签名，无需 keystore）
#
# 服务器侧前置条件：
#   - Gitea 已启用 Actions（app.ini 中 [actions] ENABLED=true）
#   - 已注册 act_runner（标签含 ubuntu-latest），详见 docs/CI.md
#   - runner 所在服务器可访问 GitHub（下载 Flutter、Gradle、pub 包、sqlite3 预编译库）
#     若网络受限，可在 runner 环境设置以下变量走镜像：
#       FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
#       PUB_HOSTED_URL=https://pub.flutter-io.cn
name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: einz-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
